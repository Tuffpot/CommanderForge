# Makes the Google Play store banner and phone screenshots from the live site.
# Run it from GitHub: Actions > Store images > Run workflow, then download
# "brewhall-store-images" from the bottom of the finished run.
name: Store images

on:
  pull_request:
    paths:
      - "commandforge-project/commandforge/store/**"
      - ".github/workflows/store-images.yml"
  workflow_dispatch:
    inputs:
      commander:
        description: "Commander to show in the deck screenshots"
        required: true
        default: "Atraxa, Praetors' Voice"

defaults:
  run:
    working-directory: commandforge-project/commandforge/store

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node screenshots.mjs
        env:
          COMMANDER: ${{ inputs.commander }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brewhall-store-images
          path: commandforge-project/commandforge/store/out/
      - name: Preview (temporary)
        run: |
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          cd out
          convert phone-1.png phone-2.png phone-3.png phone-4.png -resize 216x384 +append -quality 70 p.jpg
          convert feature-graphic.png -resize 512x250 -quality 75 f.jpg
          echo "P_BEGIN"; base64 -w0 p.jpg; echo; echo "P_END"
          echo "F_BEGIN"; base64 -w0 f.jpg; echo; echo "F_END"
