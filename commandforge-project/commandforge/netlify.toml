[build]
  command = "npm ci && npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Browsers and bots ask for /favicon.ico by default; send them the SVG icon
# instead of a "not found".
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301

# Security headers sent with every page. Netlify already serves the site over
# HTTPS; HSTS tells browsers to always use HTTPS from now on, and the rest
# stop other sites framing the page and limit where scripts, images and
# data can be loaded from.
#
# Google AdSense loads its ads, scripts and consent message from a changing
# set of Google domains and says a fixed list "may break without notice", so
# scripts, images, frames and connections are allowed from any HTTPS address.
# Inline scripts, plugins and other sites framing this one stay blocked.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss://*.supabase.co; frame-src https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
