<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600&display=swap">
<style>
  html, body { margin: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; box-sizing: border-box;
    display: flex; align-items: center; gap: 56px; padding: 0 80px;
    background-color: #0B0812;
    background-image: radial-gradient(ellipse 700px 420px at 30% 40%, rgba(88,58,120,0.55), transparent 70%);
    color: #F3EADB; font-family: Manrope, system-ui, sans-serif;
  }
  img { width: 230px; height: 230px; flex-shrink: 0; filter: drop-shadow(0 12px 40px rgba(227,178,92,0.25)); }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 92px; line-height: 1; margin: 0 0 18px; color: #F3EADB; }
  p { margin: 0; font-size: 30px; line-height: 1.3; color: rgba(243,234,219,0.75); font-weight: 600; }
  p span { color: #E3B25C; }
</style>
</head>
<body>
  <img src="../public/logo.svg" alt="">
  <div>
    <h1>Brewhall</h1>
    <p>A legal, playable <span>Commander deck</span><br>for any commander, in seconds.</p>
  </div>
</body>
</html>
